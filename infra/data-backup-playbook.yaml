---
- name: Hacer copia de seguridad de base de datos y carpeta de medios
  hosts: all
  gather_facts: true
  vars:
    backup_parent: "{{ lookup('env', 'HOME') }}/tmp/backup"
    backup_name: "wlili"
    backup_path: "{{ backup_parent }}/{{ backup_name }}"
    remote_site_path: "{{ ansible_facts['env']['HOME'] }}/sites/wlili"

  tasks:
    - name: Crear directorio de copia de seguridad si no existe
      ansible.builtin.file:
        path: "{{ backup_parent }}"
        state: directory
      delegate_to: 127.0.0.1

    # 1. Rotación de backups locales (mantener hasta 3 versiones)
    - name: Eliminar wlili2 (versión más antigua) si existe
      ansible.builtin.file:
        path: "{{ backup_parent }}/{{ backup_name }}2"
        state: absent
      delegate_to: 127.0.0.1

    - name: Renombrar wlili1 a wlili2 si existe
      ansible.builtin.command:
        cmd: "mv {{ backup_parent }}/{{ backup_name }}1 {{ backup_parent }}/{{ backup_name }}2"
      args:
        removes: "{{ backup_parent }}/{{ backup_name }}1"
        creates: "{{ backup_parent }}/{{ backup_name }}2"
      delegate_to: 127.0.0.1

    - name: Verificar existencia de backup_actual
      ansible.builtin.stat:
        path: "{{ backup_path }}"
      register: wlili_stat
      delegate_to: 127.0.0.1

    - name: Crear directorio intermedio para recibir la copia
      ansible.builtin.file:
        path: "{{ backup_parent }}/{{ backup_name }}1"
        state: directory
      when: wlili_stat.stat.exists
      delegate_to: 127.0.0.1

    - name: Sinronizar última versión a versión intermedia
      ansible.builtin.command:
        cmd: rsync -a --delete --link-dest="{{ backup_path }}" --no-owner --no-group --no-perms "{{ backup_path }}/" "{{ backup_parent }}/{{ backup_name }}1/"
      when: wlili_stat.stat.exists
      delegate_to: 127.0.0.1

    # 2. Crear nuevo directorio wlili y subdirectorio media
    - name: Crear directorio wlili si no existe (primera ejecución)
      ansible.builtin.file:
        path: "{{ backup_path }}/media"
        state: directory
      when: not wlili_stat.stat.exists
      delegate_to: 127.0.0.1

    # 3. Sincronizar base de datos y carpeta de medios
    - name: Sincronizar DB remota -> backup
      ansible.builtin.synchronize:
        src: "{{ remote_site_path }}/db.sqlite3"
        dest: "{{ backup_path }}/db.sqlite3"
        mode: pull
        delete: true
        owner: false
        group: false
        perms: false
      delegate_to: 127.0.0.1

    - name: Sincronizar media remoto -> backup/media
      ansible.builtin.synchronize:
        src: "{{ remote_site_path }}/media/"
        dest: "{{ backup_path }}/media/"
        mode: pull
        delete: true
        compress: true
        owner: false
        group: false
      delegate_to: 127.0.0.1
