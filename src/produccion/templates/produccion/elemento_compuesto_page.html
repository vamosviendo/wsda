{% extends "produccion/elemento_page_base.html" %}
{% load static %}

{% block media %}
  <div id="elementos-grid" class="imagenes-grid">
    {% for elemento in elementos %}
      {% if elemento %}
      <div class="imagen">
        <a href="{{ elemento.url }}">
          {% if elemento.tipo == 'video' %}
            <img class="tipo-icono tipo-icono-video"
                 src="{% static 'img/icon_video.svg' %}"
                 alt=""
                 aria-hidden="true">
          {% elif elemento.tipo == 'audio' %}
            <img class="tipo-icono tipo-icono-audio"
                 src="{% static 'img/icon_audio.svg' %}"
                 alt=""
                 aria-hidden="true">
          {% elif elemento.tipo == 'texto' %}
            <img class="tipo-icono tipo-icono-texto"
                 src="{% static 'img/icon_texto.svg' %}"
                 alt=""
                 aria-hidden="true">
          {% endif %}
          <img src="{{ elemento.get_thumbnail_url }}" alt="{{ elemento.alt_thumbnail }}">
        </a>
      </div>
      {% endif %}
    {% endfor %}
  </div>
{% endblock %}
